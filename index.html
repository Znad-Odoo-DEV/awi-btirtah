<body>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <h1 class="logo">عوي بترتاح</h1>
    <output class="count" id="count" aria-live="off">0</output>
    <button type="button" class="face" id="face" aria-label="عوّي"></button>
  </main>

  <div class="picker" id="picker" role="group" aria-label="الشخصيات"></div>
  <button type="button" class="mute" id="btn-mute" aria-pressed="false" aria-label="الصوت">🔊</button>

  <section class="board" id="board" aria-label="ترتيب المحافظات">
    <div class="board__bar">
      <button type="button" class="board__toggle" id="board-toggle" aria-expanded="false" aria-controls="board-body">
        <span class="board__trophy" aria-hidden="true">🏆</span>
        <span class="board__sep" aria-hidden="true"></span>
        <span class="board__top"><b id="top-rank">#1</b> <span id="top-gov">—</span> <span class="board__compact" id="top-total">0</span></span>
        <span class="board__dot" id="status-dot" aria-hidden="true"></span>
      </button>
      <button type="button" class="board__mine" id="my-gov-btn" aria-label="محافظتك">
        <span aria-hidden="true">📍</span> <span id="my-gov">—</span> <b id="my-gov-total">0</b>
      </button>
      <button type="button" class="board__chev" id="board-chev" aria-expanded="false" aria-controls="board-body" aria-label="الترتيب">⌃</button>
    </div>
    <div class="board__body" id="board-body">
      <div class="board__scroll">
        <ol class="list" id="list-govs"></ol>
      </div>
    </div>
  </section>

  <dialog class="modal modal--vote" id="vote-modal" aria-label="التصويت">
    <button type="button" class="modal__x" data-close aria-label="سكّر">✕</button>
    <p class="vote__timer"><span aria-hidden="true">⏳</span> <span id="vote-timer"></span></p>
    <div class="vote__grid" id="vote-grid"></div>
    <p class="vote__msg" id="vote-msg" role="status" hidden></p>
    <div class="vote__stage" id="vote-stage" aria-label="عوايات هالأسبوع"></div>
    <p class="vote__last" id="vote-last" hidden></p>
  </dialog>

  <dialog class="modal" id="gov-modal" aria-label="المحافظة">
    <p class="modal__icon" aria-hidden="true">📍</p>
    <div class="gov-grid" id="gov-grid"></div>
  </dialog>

  <script type="module" src="src/main.js?v=2c72439d"></script>
</body>
